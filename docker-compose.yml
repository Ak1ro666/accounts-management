version: '3'

services:
    main-db:
        image: postgres:14.1-alpine
        ports:
            - 5433:5432
        restart: always
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        volumes: # Хранение данных в postgres
            - main-db:/var/lib/postgresql/data

