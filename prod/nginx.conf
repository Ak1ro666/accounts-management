server {
  # server_name deploy.ru;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header X-Content-Type-Options "nosniff" always;

  listen 80;
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    # Добавляем кеширование, в бесконечность. Так как у каждого файла есть хеш, но может баговать с REPLACE_ если env меняются без пересборки
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Отключаем кеширование для файлов env-*.js в папке assets
  location ~ ^/assets/env-.*\.js$ {
    root /usr/share/nginx/html;

    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
  }

  client_max_body_size 20M;
  proxy_read_timeout 30s;
  proxy_connect_timeout 30s;
  proxy_send_timeout 30s;
}
